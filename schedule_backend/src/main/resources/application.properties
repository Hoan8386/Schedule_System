spring.application.name=shopping
# Secret local (không commit). Khi deploy file này không tồn tại → dùng biến môi trường.
spring.config.import=optional:classpath:application-secret.properties
#config database
##
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/schedule_system?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh
# Avoid stale RestartClassLoader after source/package changes.
spring.devtools.restart.enabled=false

# Hibernate Naming Strategy - Giữ nguyên tên bảng như trong @Table annotation
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
##
# config jwt
shopping.jwt.base64-secret=${JWT_BASE64_SECRET:}
# expriation : 1 day (seconds = 26 * 60 * 60)
shopping.jwt.access-token-validity-in-seconds=8640000
shopping.jwt.refresh-token-validity-in-seconds=8640000
shopping.frontend-login-url=https://nguyenvantrang.cloud/login
shopping.jwt.password-reset-token-validity-in-seconds=1800
#config upload file
###
#default = 1MB
spring.servlet.multipart.max-file-size=50MB
#default = 10 MB (form data)
spring.servlet.multipart.max-request-size=50MB

# Cloudflare R2 (S3-compatible object storage). Keep credentials in environment variables.
r2.enabled=${R2_ENABLED:true}
r2.endpoint=${R2_ENDPOINT:}
r2.access-key=${R2_ACCESS_KEY:}
r2.secret-key=${R2_SECRET_KEY:}
r2.bucket=${R2_BUCKET:schedule-system}
r2.region=auto
r2.public-base-url=${R2_PUBLIC_BASE_URL:}

# Khóa cho phép xuất / nhập database khi chưa đăng nhập (để trống = chỉ ADMIN, hoặc nhập lần đầu khi database trống)
app.database.setup-key=${DB_SETUP_KEY:}

# Increase Tomcat max header size (default 8KB — too small when JWT + cookies are large)
server.max-http-request-header-size=48KB
###
#config pagination
# start page = 1
spring.data.web.pageable.one-indexed-parameters=true
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Health check cho container (Vibe Host / Docker): GET /actuator/health
management.endpoints.web.exposure.include=health
management.health.mail.enabled=false
